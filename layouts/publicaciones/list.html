{{ define "main" }}

<section class="page">

    <div class="page-eyebrow">
        02 — Publicaciones
    </div>

    <h1 class="page-title">
        {{ .Title }}
    </h1>

    <div class="page-intro">
        {{ .Content }}
    </div>

    <div class="publication-list">

        {{ range .Pages.ByWeight }}

        <a href="{{ .RelPermalink }}" class="publication">

            <div class="publication-number">
                {{ printf "%03d" .Weight }}
            </div>

            <div class="publication-info">

                <h2>
                    {{ .Title }}
                </h2>

                {{ with .Params.description }}

                <p>
                    {{ . }}
                </p>

                {{ end }}

            </div>

            <div class="publication-arrow">
                →
            </div>

        </a>

        {{ end }}

    </div>

</section>


<style>

.page-intro {

    max-width: 720px;

    margin-bottom: 80px;

    color: var(--muted);

    font-size: 18px;

    line-height: 1.8;

}

.publication-list {

    border-top: 1px solid var(--line);

}

.publication {

    display: grid;

    grid-template-columns: 80px 1fr 50px;

    gap: 30px;

    align-items: center;

    padding: 42px 20px;

    border-bottom: 1px solid var(--line);

    transition:
        background 0.25s ease,
        padding 0.25s ease;

}

.publication:hover {

    background: #11110F;

    padding-left: 30px;
    padding-right: 30px;

}

.publication-number {

    color: var(--accent);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

}

.publication-info h2 {

    margin: 0 0 10px;

    color: var(--foreground);

    font-size: 32px;

    font-weight: 500;

    letter-spacing: -1px;

}

.publication-info p {

    max-width: 650px;

    margin: 0;

    color: var(--muted);

    font-size: 15px;

    line-height: 1.6;

}

.publication-arrow {

    color: var(--muted);

    font-size: 24px;

    transition:
        color 0.2s ease,
        transform 0.2s ease;

}

.publication:hover .publication-arrow {

    color: var(--accent);

    transform: translateX(5px);

}

@media (max-width: 700px) {

    .publication {

        grid-template-columns: 45px 1fr 25px;

        gap: 15px;

        padding: 30px 10px;

    }

    .publication:hover {

        padding-left: 15px;
        padding-right: 15px;

    }

    .publication-info h2 {

        font-size: 25px;

    }

    .publication-info p {

        font-size: 14px;

    }

}

</style>

{{ end }}
