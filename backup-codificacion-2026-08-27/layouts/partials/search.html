<div class="search-wrapper">

    <button
        type="button"
        class="search-toggle"
        aria-label="Buscar"
        aria-expanded="false"
        title="Buscar">

        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16L21 21"></path>
        </svg>

        <span class="search-key">⌘ K</span>

    </button>


    <div
        class="search-panel"
        aria-hidden="true">

        <div class="search-panel-inner">

            <div class="command-input-row">

                <span class="command-search-icon" aria-hidden="true">
                    ⌕
                </span>

                <input
                    id="command-search-input"
                    class="command-search-input"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Buscar, explorar o ir a…"
                    aria-label="Buscar en el sitio">

                <button
                    type="button"
                    class="command-close"
                    aria-label="Cerrar búsqueda">
                    ESC
                </button>

            </div>


            <div
                id="command-navigation"
                class="command-section">

                <div class="command-heading">
                    Navegar
                </div>

                <a href="{{ "/investigacion/" | relLangURL }}" class="command-item">
                    <span>Investigación</span>
                    <span class="command-item-arrow">↗</span>
                </a>

                <a href="{{ "/publicaciones/" | relLangURL }}" class="command-item">
                    <span>Publicaciones</span>
                    <span class="command-item-arrow">↗</span>
                </a>

                <a href="{{ "/sobre-mi/" | relLangURL }}" class="command-item">
                    <span>Sobre mí</span>
                    <span class="command-item-arrow">↗</span>
                </a>

                <a href="{{ "/cv/" | relLangURL }}" class="command-item">
                    <span>CV</span>
                    <span class="command-item-arrow">↗</span>
                </a>

                <a href="{{ "/contacto/" | relLangURL }}" class="command-item">
                    <span>Contacto</span>
                    <span class="command-item-arrow">↗</span>
                </a>

            </div>


            <div
                id="command-results"
                class="command-section command-results"
                hidden>

                <div
                    id="command-results-heading"
                    class="command-heading">
                    Resultados
                </div>

                <div
                    id="command-results-list"
                    class="command-results-list">
                </div>

            </div>

        </div>

    </div>

</div>


<style>

.search-wrapper {
    position: relative;
}


.search-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 28px;
    padding: 0 3px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition:
        color 0.2s ease,
        transform 0.2s ease;
}


.search-toggle:hover {
    color: var(--foreground);
    transform: translateY(-1px);
}


.search-toggle svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
}


.search-key {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.65;
}


.search-panel {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    max-height: 85vh;
    overflow-y: auto;

    padding: 110px 5vw 60px;

    background: var(--background);
    border-bottom: 1px solid var(--line);

    opacity: 0;
    visibility: hidden;

    transform: translateY(-12px);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s ease;
}


.search-panel.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}


.search-panel-inner {
    max-width: 900px;
    margin: 0 auto;
}


.command-input-row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 62px;
    border-bottom: 1px solid var(--line);
}


.command-search-icon {
    flex: 0 0 auto;
    margin-right: 15px;
    color: var(--muted);
    font-size: 24px;
    line-height: 1;
}


.command-search-input {
    flex: 1;
    min-width: 0;
    height: 60px;
    padding: 0;

    border: none;
    outline: none;

    background: transparent;
    color: var(--foreground);

    font-family: Arial, Helvetica, sans-serif;
    font-size: 24px;
    line-height: 1.2;
}


.command-search-input::placeholder {
    color: var(--muted);
}


.command-search-input::-webkit-search-cancel-button {
    display: none;
}


.command-close {
    flex: 0 0 auto;

    margin-left: 20px;
    padding: 5px 8px;

    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);

    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        color 0.15s ease,
        border-color 0.15s ease;
}


.command-close:hover {
    color: var(--foreground);
    border-color: var(--muted);
}


.command-section {
    padding-top: 32px;
}


.command-heading {
    margin-bottom: 18px;

    color: var(--accent);

    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;

    text-transform: uppercase;
}


.command-item {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 48px;
    padding: 0 4px;

    border-bottom: 1px solid var(--line);

    color: var(--foreground);

    font-size: 14px;

    transition:
        color 0.15s ease,
        padding-left 0.15s ease;
}


.command-item:hover {
    color: var(--accent);
    padding-left: 10px;
}


.command-item-arrow {
    color: var(--muted);
    font-size: 13px;
}


.command-results[hidden] {
    display: none;
}


.command-result {
    display: block;

    padding: 19px 4px 20px;

    border-bottom: 1px solid var(--line);

    color: inherit;

    transition:
        padding-left 0.15s ease,
        background 0.15s ease;
}


.command-result:hover,
.command-result.selected {
    padding-left: 10px;
}


.command-result-title {
    margin-bottom: 7px;

    color: var(--foreground);

    font-size: 17px;
    line-height: 1.3;
}


.command-result-meta {
    margin-bottom: 9px;

    color: var(--accent);

    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;

    text-transform: uppercase;
}


.command-result-excerpt {
    max-width: 780px;

    color: var(--muted);

    font-size: 13px;
    line-height: 1.6;
}


.command-results mark {
    background: transparent !important;
    color: var(--foreground) !important;
    text-decoration-line: underline !important;
    text-decoration-color: var(--accent) !important;
    text-decoration-thickness: 2px !important;
    text-underline-offset: 4px !important;
    text-decoration-skip-ink: auto !important;
    font-weight: 600 !important;
}


.command-results mark:hover {
    color: var(--accent) !important;
}

.command-status {
    padding: 15px 4px;

    color: var(--muted);

    font-size: 12px;
    line-height: 1.6;
}


@media (max-width: 700px) {

    .search-panel {
        max-height: 90vh;
        padding: 90px 5vw 45px;
    }


    .command-search-input {
        font-size: 20px;
    }


    .command-close {
        margin-left: 10px;
    }


    .command-item {
        min-height: 44px;
    }


    .command-result-title {
        font-size: 16px;
    }

}

</style>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const toggle =
        document.querySelector(".search-toggle");

    const panel =
        document.querySelector(".search-panel");

    const input =
        document.getElementById("command-search-input");

    const navigation =
        document.getElementById("command-navigation");

    const results =
        document.getElementById("command-results");

    const resultsHeading =
        document.getElementById("command-results-heading");

    const resultsList =
        document.getElementById("command-results-list");

    const closeButton =
        document.querySelector(".command-close");


    if (
        !toggle ||
        !panel ||
        !input ||
        !navigation ||
        !results ||
        !resultsList
    ) {
        return;
    }


    let pagefind = null;
    let selectedIndex = -1;
    let searchTimer = null;


    const currentLanguage =
        document.documentElement.lang || "es";


    function openSearch() {

        panel.classList.add("open");

        panel.setAttribute(
            "aria-hidden",
            "false"
        );

        toggle.setAttribute(
            "aria-expanded",
            "true"
        );

        setTimeout(function () {
            input.focus();
        }, 80);

    }


    function closeSearch() {

        panel.classList.remove("open");

        panel.setAttribute(
            "aria-hidden",
            "true"
        );

        toggle.setAttribute(
            "aria-expanded",
            "false"
        );

    }


    function escapeHTML(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function highlightText(value, query) {

        const safeText =
            escapeHTML(value);

        const terms =
            query
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .map(function (term) {
                    return term.replace(
                        /[.*+?^${}()|[\]\\]/g,
                        "\\$&"
                    );
                });

        if (!terms.length) {
            return safeText;
        }

        const expression =
            new RegExp(
                "(" + terms.join("|") + ")",
                "gi"
            );

        return safeText.replace(
            expression,
            "<mark>$1</mark>"
        );

    }

    function getResultURL(result) {

        if (
            result &&
            result.url
        ) {
            return result.url;
        }

        if (
            result &&
            result.meta &&
            result.meta.url
        ) {
            return result.meta.url;
        }

        return "#";

    }


    function renderResults(data, query) {

        resultsList.innerHTML = "";

        selectedIndex = -1;


        if (
            !data ||
            !data.results ||
            data.results.length === 0
        ) {

            resultsHeading.textContent =
                "Sin resultados";

            resultsList.innerHTML =
                '<div class="command-status">' +
                'No se encontraron resultados para "' +
                escapeHTML(query) +
                '".' +
                '</div>';

            return;

        }


        resultsHeading.textContent =
            "Resultados · " +
            data.results.length;


        data.results.forEach(function (result) {

            const article =
                document.createElement("a");

            article.className =
                "command-result";

            article.href =
                getResultURL(result);


            const title =
                escapeHTML(
                    result.meta &&
                    result.meta.title
                        ? result.meta.title
                        : "Sin título"
                );


            const excerpt =
                highlightText(
                    result.excerpt || "",
                    query
                );


            article.innerHTML =
                '<div class="command-result-title">' +
                    title +
                '</div>' +

                '<div class="command-result-meta">' +
                    'Resultado' +
                '</div>' +

                '<div class="command-result-excerpt">' +
                    excerpt +
                '</div>';


            resultsList.appendChild(article);

        });

    }


    async function ensurePagefind() {

        if (pagefind) {
            return pagefind;
        }


        pagefind =
            await import(
                "{{ "pagefind/pagefind.js" | relURL }}"
            );


        if (
            !pagefind ||
            typeof pagefind.search !== "function"
        ) {

            throw new Error(
                "Pagefind search() no disponible"
            );

        }


        return pagefind;

    }


    async function performSearch(query) {

        const cleanQuery =
            query.trim();


        if (!cleanQuery) {

            navigation.hidden = false;
            results.hidden = true;

            resultsList.innerHTML = "";

            resultsHeading.textContent =
                "Resultados";

            selectedIndex = -1;

            return;

        }


        navigation.hidden = true;
        results.hidden = false;


        resultsHeading.textContent =
            "Buscando…";


        resultsList.innerHTML =
            '<div class="command-status">' +
            'Consultando el repertorio…' +
            '</div>';


        try {

            const pagefindModule =
                await ensurePagefind();


            const response =
                await pagefindModule.search(
                    cleanQuery
                );


            const resolved =
                await Promise.all(
                    (response.results || []).map(
                        async function (result) {

                            const data =
                                await result.data();

                            return data;

                        }
                    )
                );


            renderResults(
                {
                    results: resolved
                },
                cleanQuery
            );

        } catch (error) {

            console.error(
                "Command Center / Pagefind:",
                error
            );


            resultsHeading.textContent =
                "Error de búsqueda";


            resultsList.innerHTML =
                '<div class="command-status">' +
                'No fue posible consultar el repertorio. ' +
                'El índice de búsqueda no está disponible.' +
                '</div>';

        }

    }


    function updateSelection(direction) {

        const items =
            resultsList.querySelectorAll(
                ".command-result"
            );


        if (!items.length) {
            return;
        }


        selectedIndex += direction;


        if (selectedIndex < 0) {
            selectedIndex =
                items.length - 1;
        }


        if (selectedIndex >= items.length) {
            selectedIndex = 0;
        }


        items.forEach(function (item, index) {

            item.classList.toggle(
                "selected",
                index === selectedIndex
            );

        });


        items[selectedIndex].scrollIntoView({
            block: "nearest"
        });

    }


    toggle.addEventListener(
        "click",
        function () {

            if (
                panel.classList.contains("open")
            ) {
                closeSearch();
            } else {
                openSearch();
            }

        }
    );


    closeButton.addEventListener(
        "click",
        closeSearch
    );


    input.addEventListener(
        "input",
        function () {

            clearTimeout(searchTimer);


            searchTimer =
                setTimeout(
                    function () {

                        performSearch(
                            input.value
                        );

                    },
                    120
                );

        }
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                (event.metaKey || event.ctrlKey) &&
                event.key.toLowerCase() === "k"
            ) {

                event.preventDefault();

                openSearch();

            }


            if (
                event.key === "Escape" &&
                panel.classList.contains("open")
            ) {

                event.preventDefault();

                closeSearch();

                toggle.focus();

            }


            if (
                !panel.classList.contains("open")
            ) {
                return;
            }


            if (event.key === "ArrowDown") {

                event.preventDefault();

                updateSelection(1);

            }


            if (event.key === "ArrowUp") {

                event.preventDefault();

                updateSelection(-1);

            }


            if (
                event.key === "Enter" &&
                selectedIndex >= 0
            ) {

                const items =
                    resultsList.querySelectorAll(
                        ".command-result"
                    );

                if (items[selectedIndex]) {

                    event.preventDefault();

                    items[selectedIndex].click();

                }

            }

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                panel.classList.contains("open") &&
                !panel.contains(event.target) &&
                !toggle.contains(event.target)
            ) {

                closeSearch();

            }

        }
    );

});

</script>
